name: API Probe

# 開發環境連唔到 SushiPass API,所以用 GitHub runner 實測:
#   1. 由非香港嘅資料中心到底通唔通
#   2. 真實回傳嘅欄位名係乜(唔再靠第三方專案推測)
# 呢個 workflow 唔會 fail,淨係如實印出收到嘅嘢。

on:
  workflow_dispatch:
  push:
    branches: [claude/sushiro-tracker-research-i03r83]
    paths: ['.github/workflows/api-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 出口 IP 同地區
        run: curl -s --max-time 20 https://ipinfo.io/json || echo "(攞唔到 IP 資訊)"

      - name: storelist 端點
        run: |
          URL='https://sushipass.sushiro.com.hk/api/2.0/info/storelist?latitude=22.32&longitude=114.17&numresults=25&region=HK'
          echo "GET $URL"
          code=$(curl -s -o /tmp/stores.json -w '%{http_code}' --max-time 30 \
            -H 'Accept: application/json' \
            -H 'User-Agent: Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120 Mobile' \
            "$URL" || echo "000")
          echo "HTTP=$code  bytes=$(wc -c < /tmp/stores.json 2>/dev/null || echo 0)"
          echo '--- 頭 1200 bytes ---'
          head -c 1200 /tmp/stores.json || true
          echo
          echo '--- 真實欄位名(權威答案)---'
          FIRST='if type=="array" then .[0] else ((.stores // .data // .storeList // []) | .[0]) end'
          jq -r "$FIRST | if . == null then \"(攞唔到任何一筆記錄)\" else (keys_unsorted | join(\", \")) end" /tmp/stores.json 2>&1 || echo "(唔係有效 JSON,見上面原始內容)"
          echo '--- 第一筆記錄 ---'
          jq -c "$FIRST" /tmp/stores.json 2>/dev/null | head -c 700 || true
          echo

      - name: groupqueues 端點
        run: |
          FIRST='if type=="array" then .[0] else ((.stores // .data // .storeList // []) | .[0]) end'
          SID=$(jq -r "$FIRST | .id // .storeId // empty" /tmp/stores.json 2>/dev/null)
          if [ -z "$SID" ]; then echo '冇 store id,跳過(storelist 已經失敗)'; exit 0; fi
          URL="https://sushipass.sushiro.com.hk/api/2.0/remote/groupqueues?region=HK&storeid=$SID"
          echo "GET $URL"
          code=$(curl -s -o /tmp/q.json -w '%{http_code}' --max-time 30 -H 'Accept: application/json' "$URL" || echo "000")
          echo "HTTP=$code"
          head -c 800 /tmp/q.json || true
          echo
          echo '--- 頂層欄位 ---'
          jq -r 'keys_unsorted | join(", ")' /tmp/q.json 2>&1 || true

      - name: 公共 CORS proxy 通唔通
        run: |
          TARGET='https://sushipass.sushiro.com.hk/api/2.0/info/storelist?latitude=22.32&longitude=114.17&numresults=25&region=HK'
          ENC=$(printf '%s' "$TARGET" | jq -sRr @uri)
          for P in "https://corsproxy.io/?url=$ENC" "https://cors.freehi.workers.dev/?$TARGET"; do
            echo "--- $(printf '%s' "$P" | cut -c1-50)…"
            curl -s -o /tmp/p.json -w '    HTTP=%{http_code} bytes=%{size_download}
          ' --max-time 25 "$P" || echo '    (連唔到)'
            head -c 250 /tmp/p.json 2>/dev/null || true
            echo
          done
